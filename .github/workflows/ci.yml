name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, test, and build
        run: pnpm check
      - name: Verify generated package entry is committed
        run: git diff --exit-code -- lib
      - name: Run routing evaluation corpus
        run: pnpm eval
      - name: Verify package contents
        run: pnpm pack --dry-run
